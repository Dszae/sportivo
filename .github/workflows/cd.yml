name: Sportivo CD (Continuous Deployment)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Build
        run: npm run build

      - name: Deploy via Vercel CLI (if secrets configured)
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Log Deployment Mode
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "ℹ️ Vercel direct CLI secrets not set; Vercel Native Git Integration is handling production deployment automatically."

  smoke-test:
    name: Post-Deployment Smoke Tests & Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for Vercel Edge Propagation
        run: |
          echo "Waiting 15 seconds for edge DNS and serverless function propagation..."
          sleep 15

      - name: Verify Live Endpoints
        id: health_check
        run: |
          TARGET_URL="https://sportivo.dipeshsapkota7.com.np"
          echo "Checking endpoints on $TARGET_URL..."

          check_endpoint() {
            local path=$1
            local expected_code=$2
            local code=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL$path" || echo "000")
            echo "Endpoint: $path | Status: $code | Expected: $expected_code"
            if [ "$code" -ne "$expected_code" ]; then
              echo "⚠️ Warning: $path returned status $code (expected $expected_code)"
              return 1
            fi
            return 0
          }

          STATUS_HOME=0
          check_endpoint "/" 200 || STATUS_HOME=$?

          STATUS_NPL=0
          check_endpoint "/npl/" 200 || STATUS_NPL=$?

          STATUS_API=0
          check_endpoint "/api/npl/fixtures/" 200 || STATUS_API=$?

          STATUS_ROBOTS=0
          check_endpoint "/robots.txt" 200 || STATUS_ROBOTS=$?

          STATUS_SITEMAP=0
          check_endpoint "/sitemap.xml" 200 || STATUS_SITEMAP=$?

          echo "### 🌐 Production Deployment Health Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Target | HTTP Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Homepage | \`/\` | 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| NPL Live Desk | \`/npl/\` | 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Fixtures API | \`/api/npl/fixtures/\` | 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO Crawler Rules | \`/robots.txt\` | 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Sitemap Index | \`/sitemap.xml\` | 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: [$TARGET_URL]($TARGET_URL)" >> $GITHUB_STEP_SUMMARY
