name: Build Real Native Android APK (React Native)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-native-apk.yml'

permissions:
  contents: write

jobs:
  build-native-apk:
    name: Compile Native Android APK (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Native Android APK with Gradle
        id: gradle_build
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Native Sportivo APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sportivo-Native-Android-APK
          path: mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Publish Direct APK Download Link via GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-apk
          name: Sportivo Native Android App v1.0.0
          body: |
            ### Sportivo Official Android App (Native APK)
            - **App ID**: `np.com.dipeshsapkota7.sportivo`
            - **Developer**: Dipesh Sapkota
            - **Features**: Native ExoPlayer streaming, NPL 2026 live scores, Nepal Standard Time (NST) kickoff alerts.
            
            Tap `app-debug.apk` below to download directly onto your Android device.
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
