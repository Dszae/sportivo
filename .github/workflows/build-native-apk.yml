name: Build Real Native Android APK (React Native)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-native-apk.yml'

jobs:
  build-native-apk:
    name: Compile Native Android APK (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate Native Android Project)
        run: |
          cd mobile
          CI=1 npx expo prebuild --platform android --clean --no-install

      - name: Compile Native Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Native Sportivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Sportivo-Native-Android-APK
          path: mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 30


