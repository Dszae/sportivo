name: Sportivo Backend CI (FastAPI, PostgreSQL, Redis, Docker)

on:
  push:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
    branches:
      - main
      - dark_mode
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test FastAPI Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportivo
          POSTGRES_PASSWORD: sportivo_secret
          POSTGRES_DB: sportivo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://sportivo:sportivo_secret@localhost:5432/sportivo_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest -v

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t sportivo-api:latest ./backend

      - name: Validate Docker Compose Config
        run: |
          docker compose config
