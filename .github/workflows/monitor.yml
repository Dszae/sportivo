name: Sportivo availability monitor

on:
  schedule:
    # Run once daily at midnight UTC instead of every 30 minutes to prevent exhausting serverless CPU quotas
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check public routes, APIs, and crawler assets
        run: npm run monitor
